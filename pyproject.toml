[project]
name = "src"
version = "0.1.0"
description = "Visão computacional para detectar cardiomegalia em raio-X de tórax — base Coração de Dados"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.2",
    "matplotlib>=3.9.1",
    "scikit-learn>=1.5.1",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
    "tensorflow>=2.18.0",
    "jupyterlab>=4.3.0",
    "ipywidgets>=8.1.3",
    "ultralytics>=8.3.0",
    "torchxrayvision>=1.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "invoke>=2.2.0",
    "nbformat>=5.10.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0",
    "nbstripout>=0.9.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
